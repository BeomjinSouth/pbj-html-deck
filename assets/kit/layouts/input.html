<section class="slide">
  <header class="hd">
    {{#tag}}<span class="tag" data-tone="{{{_tone}}}">{{tag}}</span>{{/tag}}
    <div class="fit"><h2{{#_len.title}} style="--n:{{{_len.title}}}"{{/_len.title}}>{{title}}</h2></div>
  </header>
  <div class="main">
    <div class="card qcard" data-inputs>
      <p class="qtext">{{question}}</p>
      <div class="answer">
        <input class="field" data-answer="{{answer}}"{{#tol}} data-tol="{{{tol}}}"{{/tol}} aria-label="답" autocomplete="off">
        {{#unit}}<span class="unit">{{unit}}</span>{{/unit}}
        <button class="btn c" data-check>확인</button>
      </div>
      {{#explain}}<p data-explain>{{explain}}</p>{{/explain}}
    </div>
  </div>
  {{#mascot}}<figure class="buddy" data-buddy>
    <div class="says">
      {{#say}}{{#@first}}<p class="bubble" data-when="idle">{{.}}</p>{{/@first}}{{/say}}
      <p class="bubble" data-when="correct done">{{#cheer}}{{cheer}}{{/cheer}}{{^cheer}}정답!{{/cheer}}</p>
      <p class="bubble" data-when="wrong">{{#retry}}{{retry}}{{/retry}}{{^retry}}다시 해 볼까?{{/retry}}</p>
    </div>
    {{#deck.mascot.yes}}{{asset:mascot|when-idle}}{{asset:deck.mascot.yes|when-yes}}{{asset:deck.mascot.no|when-no}}{{/deck.mascot.yes}}{{^deck.mascot.yes}}{{asset:mascot}}{{/deck.mascot.yes}}
  </figure>{{/mascot}}
</section>
